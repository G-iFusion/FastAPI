<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Умножение</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #f4f1ea;
      color: #1d1a16;
    }
    main {
      max-width: 28rem;
      margin: 0 auto;
      padding: 2rem 1rem 3rem;
    }
    h1 {
      margin: 0 0 1rem;
      font-size: 1.6rem;
      font-weight: 650;
    }
    label {
      display: block;
      margin: 0.9rem 0 0.3rem;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.6rem 0.7rem;
      font-size: 1rem;
      border: 1px solid #c8bfb2;
      border-radius: 0.4rem;
      background: #fff;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 1rem;
    }
    button {
      padding: 0.6rem 0.9rem;
      font-size: 1rem;
      border: 0;
      border-radius: 0.4rem;
      background: #2f5d50;
      color: #fff;
    }
    button:disabled {
      background: #b7b1a8;
    }
    .error {
      min-height: 1.3rem;
      margin: 0.8rem 0 0;
      color: #8d2b2b;
    }
  </style>
</head>
<body>
  <main>
    <h1>Умножение</h1>
    <form id="form">
      <div id="fields">
        <label for="n1">Множитель 1</label>
        <input id="n1" inputmode="decimal" autocomplete="off" required>
        <label for="n2">Множитель 2</label>
        <input id="n2" inputmode="decimal" autocomplete="off" required>
      </div>
      <div class="actions">
        <button type="button" id="add">Добавить множитель</button>
        <button type="submit" id="multiply">Умножить</button>
      </div>
      <p class="error" id="error"></p>
      <label for="product">Произведение</label>
      <input id="product" readonly>
    </form>
  </main>
  <script>
    const fields = document.querySelector("#fields");
    const addButton = document.querySelector("#add");
    const multiplyButton = document.querySelector("#multiply");
    const product = document.querySelector("#product");
    const error = document.querySelector("#error");
    const numberPattern = /^-?\d+([.,]\d{1,3})?$/;

    function inputs() {
      return [...fields.querySelectorAll("input")];
    }

    addButton.addEventListener("click", () => {
      const number = inputs().length + 1;
      const label = document.createElement("label");
      label.htmlFor = "n" + number;
      label.textContent = "Множитель " + number;
      const input = document.createElement("input");
      input.id = "n" + number;
      input.inputMode = "decimal";
      input.autocomplete = "off";
      fields.append(label, input);
      if (inputs().length >= 5) {
        addButton.disabled = true;
      }
    });

    document.querySelector("#form").addEventListener("submit", async (event) => {
      event.preventDefault();
      error.textContent = "";
      product.value = "";
      const numbers = [];
      const values = inputs();
      for (let index = 0; index < values.length; index += 1) {
        const value = values[index].value.trim();
        if (!value) {
          if (index < 2) {
            error.textContent = "Первые два множителя обязательны.";
            return;
          }
          continue;
        }
        if (!numberPattern.test(value)) {
          error.textContent = "Допустимы целые и дроби не более чем с 3 знаками после запятой.";
          return;
        }
        numbers.push(value.replace(",", "."));
      }
      multiplyButton.disabled = true;
      try {
        const response = await fetch("/multiply", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ numbers })
        });
        const data = await response.json();
        if (!response.ok) {
          error.textContent = data.detail || "Не удалось вычислить произведение.";
          return;
        }
        product.value = data.product;
      } catch (_err) {
        error.textContent = "Не удалось вычислить произведение.";
      } finally {
        multiplyButton.disabled = false;
      }
    });
  </script>
</body>
</html>
